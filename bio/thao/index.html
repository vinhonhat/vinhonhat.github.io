<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <script>
    (() => {
      const path = location.pathname.replace(/\/+/g, "/");
      const marker = "/bio/";
      const markerIndex = path.toLowerCase().indexOf(marker);
      const basePath = markerIndex >= 0
        ? path.slice(0, markerIndex + marker.length)
        : "/";
      const base = document.createElement("base");
      base.href = basePath;
      document.head.appendChild(base);
      window.BIO_BASE_PATH = new URL(basePath, location.origin).pathname;
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6b73c" />
  <meta name="description" content="Trang Bio Link cá nhân" />
  <meta property="og:title" content="Bio Link" />
  <meta property="og:description" content="Website, mạng xã hội và các liên kết hữu ích." />
  <meta property="og:image" content="assets/share-card.svg" />
  <meta property="og:type" content="website" />
  <title>Vinh ở Nhật | Bio Link</title>
  <link id="faviconLink" rel="icon" href="assets/favicon.png" type="image/png" />
  <link id="appleTouchIcon" rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=1.6.10" />
</head>
<body>
  <div class="background" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grain"></span>
  </div>

  <main class="page-shell">
    <section class="bio-card" aria-labelledby="profile-name">
      <div class="top-actions">
        <div class="language-control">
          <button class="icon-button language-button" id="languageButton" type="button" aria-label="Đổi ngôn ngữ" title="Đổi ngôn ngữ">
            <img id="languageFlag" src="assets/flag-vi.svg" alt="VI" />
          </button>
          <div id="languageMenu" class="language-menu hidden" role="menu" aria-label="Chọn ngôn ngữ">
            <button type="button" data-language="vi" role="menuitem" aria-label="Tiếng Việt" title="Tiếng Việt"><img src="assets/flag-vi.svg" alt="VI" /><b>VI</b></button>
            <button type="button" data-language="ja" role="menuitem" aria-label="日本語" title="日本語"><img src="assets/flag-ja.svg" alt="JP" /><b>JP</b></button>
            <button type="button" data-language="en" role="menuitem" aria-label="English" title="English"><img src="assets/flag-en.svg" alt="EN" /><b>EN</b></button>
          </div>
        </div>
        <button class="icon-button" id="themeButton" type="button" aria-label="Đổi giao diện" title="Đổi giao diện"></button>
        <button class="icon-button" id="shareButton" type="button" aria-label="Chia sẻ trang" title="Chia sẻ trang"></button>
      </div>

      <header class="profile">
        <div class="avatar-wrap" title="Tương tác với logo">
          <img id="profileAvatar" class="avatar" src="assets/avatar.svg" alt="Ảnh đại diện Vinh ở Nhật" />
          <span class="status-dot" title="Đang hoạt động"></span>
          <span class="cache-reset-ring" aria-hidden="true">
            <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"></circle></svg>
          </span>
        </div>

        <div class="name-line">
          <h1 id="profileName">Vinh ở Nhật</h1>
          <span class="verified" title="Liên kết chính thức" aria-label="Liên kết chính thức"></span>
        </div>
        <p id="profileHandle" class="handle">@vinhonhat</p>
        <p id="profileBio" class="bio-text">Chia sẻ cuộc sống, công nghệ và những tiện ích hữu ích tại Nhật Bản.</p>

        <div id="profileBadges" class="profile-badges"></div>
      </header>

      <div id="announcement" class="announcement hidden" role="status"></div>

      <section id="linksContainer" class="links" aria-label="Danh sách liên kết"></section>

      <section id="socialSection" class="social-section hidden" aria-label="Mạng xã hội">
        <p id="socialSectionLabel" class="section-label">Kết nối với tôi</p>
        <div id="socialContainer" class="social-row"></div>
      </section>

      <footer class="footer">
        <button id="qrButton" class="footer-action" type="button"></button>
        <span class="footer-separator">•</span>
        <span id="footerText">Vinh ở Nhật</span>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="qrModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card qr-modal-card" role="dialog" aria-modal="true" aria-labelledby="qrProfileName">
      <button class="modal-close" type="button" data-close-modal aria-label="Đóng"></button>
      <div class="modal-icon"></div>
      <h2 id="qrTitle" class="sr-only">Chia sẻ trang Bio</h2>
      <p id="qrDescription" class="sr-only">Quét mã QR hoặc sao chép đường dẫn để mở nhanh trang này.</p>

      <div id="qrBusinessCard" class="qr-business-card">
        <div class="qr-profile-column">
          <div class="qr-avatar-wrap">
            <img id="qrProfileAvatar" class="qr-profile-avatar" src="assets/avatar.svg" alt="" />
          </div>
          <div class="qr-name-line">
            <strong id="qrProfileName">Vinh ở Nhật</strong>
            <span id="qrVerified" class="verified qr-verified" title="Tài khoản xác minh" aria-label="Tài khoản xác minh"></span>
          </div>
          <span id="qrProfileHandle" class="qr-profile-handle">@vinhonhat</span>
        </div>
        <div id="qrCanvas" class="qr-box" aria-label="Mã QR của trang"></div>
        <p id="qrCardHint" class="qr-card-hint">Quét mã để kết nối</p>
        <span id="qrCardUrl" class="qr-card-url"></span>
      </div>

      <div class="qr-action-row">
        <button id="copyLinkButton" class="copy-button" type="button"></button>
        <button id="downloadQrCardButton" class="download-qr-button" type="button"></button>
      </div>
    </section>
  </div>

  <noscript>Trang này cần JavaScript để hiển thị danh sách liên kết.</noscript>
  <script>
    (() => {
      const VERSION = "1.6.10";
      const basePath = window.BIO_BASE_PATH || "/";
      const pathname = decodeURIComponent(location.pathname);
      let relativePath = pathname.startsWith(basePath) ? pathname.slice(basePath.length) : "";
      relativePath = relativePath.replace(/(^|\/)index\.html$/i, "").replace(/^\/+|\/+$/g, "");
      let slug = relativePath.split("/").filter(Boolean)[0] || "vinh";
      slug = slug.toLowerCase().replace(/[^a-z0-9_-]/g, "") || "vinh";
      const profileDir = slug === "vinh" ? "" : `${slug}/`;
      window.BIO_PROFILE_SLUG = slug;
      window.BIO_PROFILE_DIR = profileDir;
      window.BIO_PROFILE_DATA_FILE = `${profileDir}profile.js`;
      document.documentElement.dataset.bioProfile = slug;

      const load = src => new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.async = false;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });

      load(`shared-assets.js?v=${VERSION}`)
        .then(() => load(`${profileDir}profile.js?v=${VERSION}`))
        .then(() => load(`js/qrcode.min.js?v=${VERSION}`))
        .then(() => load(`js/jszip.min.js?v=${VERSION}`))
        .then(() => load(`js/script.js?v=${VERSION}`))
        .catch(error => {
          console.error("Không thể tải hồ sơ Bio:", error);
          document.body.innerHTML = `<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif"><section style="max-width:540px;text-align:center"><h1>Không thể tải hồ sơ</h1><p>Hãy kiểm tra file <code>${profileDir}profile.js</code>.</p></section></main>`;
        });
    })();
  </script>
</body>
</html>
