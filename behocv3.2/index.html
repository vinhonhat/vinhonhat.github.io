<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Bé Vui Học - Vinh ở Nhật</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6AD55">
    <link rel="apple-touch-icon" href="img/logo1.png">
    <link rel="icon" href="/img/logoQV.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game-core.css">
</head>
<body>

    <!-- Màn hình mở khóa âm thanh -->
    <div class="overlay" id="start-overlay">
        <h1 class="app-title">Bé Vui Học</h1>
        
        <button id="start-btn" class="start-btn" type="button">
            ▶️ VÀO CHƠI
        </button>
        <div id="update-hint" class="update-hint" style="display:none;">
            Có bản cập nhật mới. Nhấn đúp “Vào chơi” để cập nhật.
        </div>
        <button id="pwa-install-btn" class="install-btn" type="button" style="display:none;">
            📲 Cài App Cho Bé
        </button>
        <div class="splash-version">v3.2 Beta 2.2</div>
        <div id="ios-guide" class="install-guide" style="display:none;">
            <p class="install-guide-title">Để cài trên iPhone:</p>
            <p class="install-guide-text">
                Bấm <b>Chia sẻ</b>
                <img 
                    src="https://img.icons8.com/ios-glyphs/30/000000/share-rounded.png" 
                    class="install-share-icon"
                    alt="share">
                chọn <b>"Thêm vào MH chính"</b>
            </p>
        </div>
    </div>

    <!--
    <span class="menu-beta-badge">Beta</span>   copy cho nhãn beta
    <span class="menu-new-app">New</span>       copy cho nhãn New
    <span class="menu-beta-dev">Dev</span>      copy cho nhãn dev
    -->
    <div class="app-container">
        <div class="menu-view" id="menu-screen">
            <h1 class="app-title" style="font-size:2.5rem;">Bé chọn bài nhé</h1>

            <div class="menu-grid">
                <button class="menu-btn btn-abc" type="button" onclick="startGame('alphabet')">
                    <span class="menu-version">V3.0</span>
                    <div class="menu-icon">🔤</div>
                    <div class="menu-label">Bảng Chữ Cái</div>
                </button>

                <button class="menu-btn btn-num" type="button" onclick="startGame('listen_number')">
                    <!--<span class="menu-new-app">New</span>-->
                    <span class="menu-version">V2</span>
                    <div class="menu-icon">👂</div>
                    <div class="menu-label">Nghe & Tìm Số</div>
                </button>

                <button class="menu-btn btn-count" type="button" onclick="startGame('count')">
                    <!--<span class="menu-new-app">New</span>-->
                    <span class="menu-version">V1.1</span>
                    <div class="menu-icon">🍎</div>
                    <div class="menu-label">Tập Đếm</div>
                </button>

                <button class="menu-btn btn-color" type="button" onclick="startGame('color')">
                    <!--<span class="menu-new-app">New</span>-->
                    <span class="menu-version">V1.1</span>
                    <div class="menu-icon">🎨</div>
                    <div class="menu-label">Màu Sắc</div>
                </button>

                <button class="menu-btn btn-animal" type="button" onclick="startGame('match_animal')">
                    <span class="menu-beta-badge">Beta</span>
                    <div class="menu-icon">🐶</div>
                    <div class="menu-label">Tìm Con Vật</div>
                </button>

                <button class="menu-btn btn-num" type="button" onclick="startGame('math')" style="background:linear-gradient(135deg,#ff9966 0%,#ff5e62 100%);">
                    <span class="menu-beta-badge">Beta</span>
                    <div class="menu-icon">➕➖</div>
                    <div class="menu-label">Bé Tập Tính</div>
                </button>

                <button class="menu-btn btn-connect" onclick="startGame('alphabet_connect')" style="background:linear-gradient(135deg,#4facfe 0%,#43e97b 100%); ">
                    <!--<span class="menu-new-app">New</span>-->
                    <span class="menu-version">V1.1</span>
                    <div class="menu-icon">🔗</div>
                    <div class="menu-label">Nối Chữ</div>
                </button>

                <button class="menu-btn btn-num" type="button" onclick="startGame('math2')" style="background:linear-gradient(135deg,#4facfe 0%,#43e97b 100%);">
                    <span class="menu-beta-dev">Dev</span>
                    <div class="menu-icon">🧩</div>
                    <div class="menu-label">Bé Tách Gộp</div>
                </button>

                <button class="menu-btn btn-num" type="button" onclick="startGame('math4')" style="background:linear-gradient(135deg,#4facfe 0%,#43e97b 100%); ">
                    <span class="menu-beta-dev">dev</span>
                    <div class="menu-icon">🧮</div>
                    <div class="menu-label">Bé Tách Gộp 2</div>
                </button>
                <!--<button class="menu-btn btn-frame-test" type="button" onclick="startGame('frame_test')">
                    <span class="menu-beta-badge">Test</span>
                    <div class="menu-icon">🧪</div>
                    <div class="menu-label">Test Khung</div>
                </button> -->
            </div>
        </div>

        <div class="game-view" id="game-screen" style="display:none;"></div>
    </div>

    <script src="js/asset.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game-core.js"></script>
    <script src="js/core.js"></script>
</body>
</html>
