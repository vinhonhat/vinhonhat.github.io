<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bé Vui Học - Vinh ở Nhật</title>
    <!-- 🔹 Khai báo file manifest (dùng cho cài web thành app PWA) -->
    <link rel="manifest" href="/manifest.json"> 

<!-- 🔹 Màu thanh trình duyệt khi lưu như ứng dụng -->
    <meta name="theme-color" content="#F6AD55"> 

<!-- 🔹 Icon khi thêm vào màn hình chính của iPhone -->
    <link rel="apple-touch-icon" href="/img/logo1.png"> 
    
<!-- 🔹 Icon website (favicon) -->
    <link rel="icon" href="/img/logoQV.png" type="image/x-icon"> 

<!-- 🔹 Dùng Tailwind CSS qua CDN để tạo giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    
<!-- 🔹 Kết nối font chữ Google: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🔹 Thư viện icon FontAwesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 🔹 File CSS riêng của bạn -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/behoc/css/style.css">
</head>
<body>

    <div class="overlay" id="start-overlay">
        <h1 class="app-title">Bé Vui Học</h1>
        <button class="start-btn" onclick="unlockAudio()">▶️ VÀO CHƠI</button>
        
        <button id="pwa-install-btn" class="install-btn" style="display: none;">
            📲 Cài App Cho Bé
        </button>
        
        <div id="ios-guide" style="display: none; margin-top: 20px; color: #555; text-align: center; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px;">
            <p style="margin:0">Để cài trên iPhone:</p>
            <p style="margin:5px 0 0 0">Bấm <b>Chia sẻ</b> <img src="https://img.icons8.com/ios-glyphs/30/000000/share-rounded.png" style="width:15px"> chọn <b>"Thêm vào MH chính"</b></p>
        </div>
    </div>

    <div class="app-container">
        
        <div class="menu-view" id="menu-screen">
            <h1 class="app-title" style="font-size: 2.5rem;">Bé chọn bài nhé</h1>
            <div class="menu-grid">
                <div class="menu-btn btn-num" onclick="startGame('listen_number')">
                    <div class="menu-icon">👂</div>
                    <div class="menu-label">Nghe & Tìm Số</div>
                </div>
                <div class="menu-btn btn-count" onclick="startGame('count')">
                    <div class="menu-icon">🍎</div>
                    <div class="menu-label">Tập Đếm</div>
                </div>
                <div class="menu-btn btn-color" onclick="startGame('color')">
                    <div class="menu-icon">🎨</div>
                    <div class="menu-label">Màu Sắc</div>
                </div>
                <div class="menu-btn btn-animal" onclick="startGame('match_animal')">
                    <div class="menu-icon">🐶</div>
                    <div class="menu-label">Tìm Con Vật</div>
                </div>
                <div class="menu-btn btn-num" onclick="startGame('math')" style="background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);">
                    <div class="menu-icon">🧮</div>
                    <div class="menu-label">Bé Tập Tính</div>
                </div>
                <div class="menu-btn btn-abc" onclick="startGame('alphabet')">
                    <div class="menu-icon">🔤</div>
                    <div class="menu-label">Bảng Chữ Cái</div>
                </div>
            </div>
        </div>

        <div class="game-view" id="game-screen">
            <div class="top-bar">
                <button class="back-btn" onclick="backToMenu()">🏡 Menu</button>
                <div style="font-size: 2rem; font-weight: bold; color: #ff6f00;">⭐ <span id="score">0</span></div>
            </div>

            <div class="display-area" id="display-area">
                <div id="question-content"></div>
                <button class="replay-btn" onclick="playQuestionAudio()">🔊</button>
            </div>

            <div class="options-grid" id="options-grid"></div>
        </div>

    </div>

    <script src="js/core.js"></script>

    <script src="js/games/game_number.js"></script>
    <script src="js/games/game_count.js"></script>
    <script src="js/games/game_color.js"></script>
    <script src="js/games/game_animal.js"></script>
    <script src="js/games/game_math.js"></script>
    <script src="js/games/game_alphabet.js"></script>

</body>
</html>
</body>
</html>
