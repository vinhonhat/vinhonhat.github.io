<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Chữ Cái Tiếng Việt</title>
    <!-- 🔹 Icon website (favicon) -->
    <link rel="icon" href="/img/logoQV.png" type="image/x-icon"> 
    <link rel="stylesheet" href="/behocv2/css/game.css">
    <link rel="stylesheet" href="./alphabet.css">
</head>
<body>

<div class="alphabet-game-container">
    <div class="alphabet-shell">

        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">🏠</button>
            <div id="alphabet-score" class="score-box">⭐ 0</div>
            <button id="mode-btn" class="mode-btn" onclick="switchAlphabetMode()">🎯</button>
        </div>

        <div class="game-content">

            <div id="learn-panel" class="mode-panel">
                <div class="flashcard" onclick="replayAlphabetAudio()">
                    <div class="char-box">
                        <div id="char-upper">A</div>
                        <div id="char-lower">a</div>
                    </div>
                    <div class="illustration-box">
                        <img id="item-image" src="" alt="Hình minh họa">
                        <div id="item-word">cái ca</div>
                        <div class="audio-hint">🔊</div>
                    </div>
                </div>

                <div id="keyboard" class="keyboard-grid"></div>
            </div>

            <div id="practice-panel" class="mode-panel" style="display: none;">
                <div class="question-box">

                    <div class="image-wrapper">
                        <img id="practice-img" src="" alt="Câu hỏi">
                    </div>

                    <div class="question-footer">

                        <div id="practice-answer-word"></div>

                        <button
                            class="sound-question-btn"
                            onclick="playPracticeQuestion()">
                            🔊
                        </button>

                    </div>

                </div>

                <div id="options-grid" class="options-grid"></div>
            </div>

        </div>

    </div>
</div>

<script src="/behocv2/js/game.js"></script>
<script src="./alphabet.js"></script>
</body>
</html>
