<!DOCTYPE html>

<head>

    <title>Bé Vui Học - Vinh ở Nhật</title>
    <!-- 🔹 Khai báo file manifest (dùng cho cài web thành app PWA) -->
    <link rel="manifest" href="/behoc/manifest.json"> 

<!-- 🔹 Màu thanh trình duyệt khi lưu như ứng dụng -->
    <meta name="theme-color" content="#F6AD55"> 

<!-- 🔹 Icon khi thêm vào màn hình chính của iPhone -->
    <link rel="apple-touch-icon" href="/img/logo1.png"> 
    
<!-- 🔹 Icon website (favicon) -->
    <link rel="icon" href="/img/logoQV.png" type="image/x-icon"> 

<!-- 🔹 Dùng Tailwind CSS qua CDN để tạo giao diện -->
    <script src="https://cdn.tailwindcss.com"></script>
    
<!-- 🔹 Kết nối font chữ Google: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 🔹 Thư viện icon FontAwesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- 🔹 File CSS riêng của bạn -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/behoc/css/style.css">

    <style>
        /* CSS đưa dòng chữ phiên bản xuống góc dưới cùng bên phải màn hình game */
        .game-version-bottom-right {
            position: absolute;
            bottom: 10px;    /* Cách cạnh dưới màn hình game 10px */
            right: 15px;     /* Cách cạnh phải màn hình game 15px */
            font-size: 0.75rem;
            color: #a0aec0;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 100;    /* Đảm bảo luôn nằm trên cùng không bị che */
            pointer-events: none; /* Tránh việc bé bấm nhầm vào chữ */
            animation: cornerVersionJump 2.5s ease-in-out infinite;
        }

        .menu-beta-badge {
            position: absolute;
            top: 8px;       /* Cách mép trên 8px */
            right: 8px;     /* Cách mép phải 8px */
            font-size: 0.6rem;
            background: #000000;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #ffffff; /* Thêm viền trắng cho nổi bật trên nền gradient */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1;
            z-index: 10;
            animation: betaBadgeCornerJump 2s ease-in-out infinite;
        }
        /* Hiệu ứng nhún nhảy nhẹ nhàng, đổi màu sắc sinh động tại góc phải */
        @keyframes cornerVersionJump {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            50% {
                transform: translateY(0px); /* Nhảy nhẹ lên 4px */
                opacity: 0.9;
                color: #ff9800; /* Đổi màu cam nhẹ tạo điểm nhấn công nghệ */
            }
        }
        
        /* ⚠️ Lưu ý: Nếu nút chứa game-view (#game-screen) trong style.css chưa có position, 
        bạn thêm thuộc tính này để định vị absolute của thẻ con chạy chính xác */
        #game-screen {
            position: relative;
        }
    </style>
</head>
<body>

    <div class="overlay" id="start-overlay">
        <h1 class="app-title">Bé Vui Học</h1>
        <button class="start-btn" onclick="unlockAudio()">▶️ VÀO CHƠI</button>
        
        <button id="pwa-install-btn" class="install-btn" style="display: none;">
            📲 Cài App Cho Bé
        </button>
        
        <div id="ios-guide" style="display: none; margin-top: 20px; color: #555; text-align: center; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 10px;">

            <p style="margin:5px 0 0 0">Bấm <b>Chia sẻ</b> <img src="https://img.icons8.com/ios-glyphs/30/000000/share-rounded.png" style="width:15px"> chọn <b>"Thêm vào MH chính"</b></p>
        </div>
    </div>

    <div class="app-container">
        
        <div class="menu-view" id="menu-screen">

                <div class="menu-btn btn-color" onclick="startGame('color')">

                </div>
                <div class="menu-btn btn-animal" onclick="startGame('match_animal')">
                    <div class="menu-icon">🐶</div>

                </div>
                <div class="menu-btn btn-num" onclick="startGame('math')" style="background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%);">
                    <div class="menu-icon">➕➖</div>

                <div class="menu-btn btn-num" onclick="startGame('math2')" style="background: linear-gradient(135deg, #4facfe 0%, #43e97b 100%);">

                    <span class="menu-beta-badge">Beta</span>
                    <div class="menu-icon">🧮</div>
                    <div class="menu-label">Bé Tách Gộp 2</div>
                </div>

<script src="js/core.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Kiểm tra xem có phải vừa từ trong game quay ra không
            if (sessionStorage.getItem('skipIntro') === 'true') {
                // Ẩn màn hình chào đi
                const startOverlay = document.getElementById('start-overlay');
                if (startOverlay) {
                    startOverlay.style.display = 'none';
                }
                
                // Nếu hàm unlockAudio() của bạn có sẵn trong core.js thì chạy luôn để kích hoạt âm thanh
                if (typeof unlockAudio === 'function') {
                    unlockAudio();
                }
                
                // Xóa dấu vết để lần sau mở app từ đầu vẫn hiện màn hình chào bình thường
                sessionStorage.removeItem('skipIntro');
            }
        });
    </script>
</body>
