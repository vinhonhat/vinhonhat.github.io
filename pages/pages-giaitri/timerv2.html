<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ cát | Vinh ở Nhật</title> 
    
    <link rel="manifest" href="/manifest.json"> 
    <meta name="theme-color" content="#F6AD55"> 
    <link rel="apple-touch-icon" href="/img/logo1.png"> 
    <link rel="icon" href="/img/logoQV.png" type="image/x-icon"> 

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        :root { --primary-color: #ff6b6b; }
        .hourglass-body { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 2rem; }
        /* Khi màn hình rộng (PC) */
        @media (min-width: 1024px) {
            .hourglass-body {
                flex-direction: row-reverse; /* PC: Đảo ngược - Đồng hồ bên phải, Nút bên trái */
                align-items: flex-start;
                justify-content: center;
            }
        }
        .primary-btn { background: var(--primary-color); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: opacity 0.2s; width: 100%; }
        .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        /* Nút phụ (Tạm dừng, Kết thúc) */
        .secondary-btn {padding: 10px; border-radius: 8px; font-weight: 600; color: white; transition: opacity 0.2s; }
        #hourglassCanvas { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); background: #f9fafb; border-radius: 12px; }
    </style>
</head>

<body class="bg-[#FBF7F0]">
    <div id="header-placeholder" class="sticky top-0 z-50 bg-white shadow-md"></div>

    <main class="container mx-auto px-4 sm:px-6 lg:px-8 xl:px-24 mt-4">
    <div class="mb-4 lg:w-2/3">
        <h1 class="text-2xl font-bold text-gray-800 border-l-8 border-yellow-500 pl-4">Đồng Hồ Cát</h1>
        <p class="text-gray-500 italic pl-6">Công cụ giải trí trực tuyến</p>
    </div>

    <div class="flex flex-col lg:flex-row lg:space-x-8">
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 border-b-2 border-yellow-500 inline-block pb-2">Đồng Hồ Cát Diệu Kỳ</h1>
            </div>

            <div class="hourglass-body flex flex-col lg:flex-row-reverse items-center lg:items-start justify-center gap-8 w-full">
    
    <div class="relative w-[300px] h-[400px] flex-shrink-0">
        <canvas id="hourglassCanvas"></canvas>
        <div id="timerDisplay" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-3xl font-mono font-bold text-gray-800 bg-white/90 px-4 py-1 rounded-full shadow-md z-10">
            00:00
        </div>
    </div>

    <div class="w-full max-w-[300px] space-y-4">
        <div class="flex flex-col">
            <label class="text-sm text-gray-500 mb-1 ml-1 font-semibold">Thời gian (giây)</label>
            <input id="timeInput" type="number" value="60" min="1" class="w-full p-3 border-2 border-gray-200 rounded-lg focus:border-yellow-500 outline-none transition-colors">
        </div>
        
        <div class="grid grid-cols-1 gap-2">
            <button id="startBtn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition-all uppercase tracking-wider">
                Bắt đầu
            </button>
            
            <div class="grid grid-cols-2 gap-2">
                <button id="pauseBtn" class="bg-gray-500 hover:bg-gray-600 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition-all uppercase text-sm" disabled>
                    Tạm dừng
                </button>
                <button id="stopBtn" class="bg-red-500 hover:bg-red-600 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition-all uppercase text-sm" disabled>
                    Kết thúc
                </button>
            </div>
        </div>
</div>
        </div>

        <aside class="lg:w-1/3 mt-10 lg:mt-0">
            <div class="sticky top-24 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold text-gray-800 border-l-4 border-yellow-500 pl-3 mb-4">Bài viết gợi ý</h2>
                <div id="suggested-posts-container" class="grid grid-cols-2 gap-4 lg:grid-cols-1"></div>
            </div>
        </aside>
    </div>
</main>

    <div id="footer-placeholder"></div>

    <script src="/js/script.js"></script>
    <script src="/js/content.js"></script>
    <script src="/js/lunar-calendar.js"></script>
    <script src="/pages/page-leve3.js"></script>


    <script>
        let interval = null;
        let isPaused = false;
        let isRunning = false;
        let timeLeft = 0;
        let sandTop = 1000;
        let sandBottom = 0;
        const totalSand = 1000;
        const SAND_COLOR = "#f6ad55";
        let particles = [];

        const canvas = document.getElementById('hourglassCanvas');
        const ctx = canvas.getContext('2d');
        const timeInput = document.getElementById('timeInput');
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');

        canvas.width = 300;
        canvas.height = 400;

        
        class Particle {
            constructor() {
                this.x = 150 + (Math.random() - 0.5) * 4;
                this.y = 200;
                this.vy = Math.random() * 2 + 3;
                this.targetY = 375 - (Math.random() * 10);
            }
            update() { if (this.y < this.targetY) this.y += this.vy; }
            draw() {
                ctx.fillStyle = SAND_COLOR;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawSand() {
            const topRatio = sandTop / totalSand;
            const bottomRatio = sandBottom / totalSand;
            ctx.fillStyle = "#f6ad55"; // Màu vàng cát đồng nhất

            // ===== CÁT TRÊN: Thu hẹp dần về phía cổ =====
            // Vẽ khối cát trên (Hình tam giác thu nhỏ dần)
                    if (sandTop > 0) {
                        ctx.beginPath();
                        ctx.moveTo(140 - (75 * topRatio), 193 - (170 * topRatio));
                        ctx.lineTo(160 + (75 * topRatio), 193 - (170 * topRatio));
                        ctx.lineTo(150 + 2, 200);
                        ctx.lineTo(150 - 2, 200);
                        ctx.fill();
                    }

            // ===== CÁT DƯỚI: Đổ đầy từ đáy và nở rộng theo khung hình thang =====
            if (sandBottom > 0) {
                ctx.beginPath();
                // Tính toán độ cao khối cát dưới (tối đa 170px từ đáy 375 lên đến cổ 205)
                const sandHeight = 170 * bottomRatio;
                const currentY = 375 - sandHeight;
                
                // Điểm trái trên và phải trên của khối cát (nở rộng dần khi dâng cao)
                // Khi ở đáy (currentY=375), độ rộng là 80. Khi lên cổ (currentY=205), độ rộng là 5.
                const widthAtY = 80 - (75 * bottomRatio); 

                ctx.moveTo(150 - widthAtY, currentY);
                ctx.lineTo(150 + widthAtY, currentY);
                // Hai điểm cố định ở đáy đồng hồ
                ctx.lineTo(235, 375);
                ctx.lineTo(65, 375);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawFrame() {
            ctx.strokeStyle = "#4A5568";
            ctx.lineWidth = 6;
            ctx.lineJoin = "round";
            
            ctx.beginPath();
            // Vẽ khung kính hình tam giác đối đỉnh
            ctx.moveTo(60, 20); ctx.lineTo(240, 20); // Đỉnh
            ctx.lineTo(150, 200);                    // Cổ
            ctx.lineTo(240, 380);                    // Đáy phải
            ctx.lineTo(60, 380);                     // Đáy trái
            ctx.lineTo(150, 200);                    // Cổ về lại
            ctx.lineTo(60, 20);                      // Lên đỉnh trái
            ctx.stroke();

            // Vẽ đế gỗ (Mệnh Kim hợp màu nâu gỗ/vàng)
            ctx.fillStyle = "#744210";
            ctx.fillRect(50, 10, 200, 10);
            ctx.fillRect(50, 380, 200, 10);
        }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawSand();
                particles.forEach(p => { p.update(); p.draw(); });
                drawFrame();
                if (isRunning || particles.some(p => p.y < p.targetY)) {
                    requestAnimationFrame(animate);
                }
            }

        function startTimer() {
            if (isRunning && !isPaused) return;

            if (!isPaused) { // Nếu bắt đầu mới (không phải tiếp tục từ tạm dừng)
                const secs = parseInt(timeInput.value) || 60;
                timeLeft = secs;
                sandTop = totalSand;
                sandBottom = 0;
                particles = [];
            }

            isRunning = true;
            isPaused = false;
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'block';
            stopBtn.style.display = 'block';
            pauseBtn.textContent = "Tạm dừng";

            const flow = totalSand / (parseInt(timeInput.value) || 60);
            animate();

        interval = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                sandTop -= flow;
                sandBottom += flow;
                
                // Cập nhật hiển thị
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                timerDisplay.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;

                if (timeLeft <= 0) {
                    resetToInput();
                    timerDisplay.textContent = "HẾT GIỜ";
                    startBtn.textContent = "Chạy lại";
                }
            }
        }, 1000);}

        // Hàm reset trạng thái nút
        function resetToInput() {
            clearInterval(interval);
            isRunning = false;
            isPaused = false;
            startBtn.style.display = 'block';
            pauseBtn.style.display = 'none';
            stopBtn.style.display = 'none';
        }

        pauseBtn.onclick = () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "Tiếp tục" : "Tạm dừng";
        };

        stopBtn.onclick = () => {
            resetToInput();
            timerDisplay.textContent = "00:00";
            startBtn.textContent = "Bắt đầu";
        };
        startBtn.onclick = startTimer;
        drawFrame();
    </script>
</body>
</html>
