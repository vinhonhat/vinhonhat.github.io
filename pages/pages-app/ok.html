<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OK Card App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* YÊU CẦU 4: MÀU NỀN NGOÀI CÙNG */
            /* Bạn chỉnh mã màu #... dưới đây cho trùng với rìa ảnh của bạn */
            background-color: #757575; 
            display: flex;
            justify-content: center;
            height: 100vh;
            /* Ngăn cuộn trang để giống app thật */
            overflow: hidden; 
            font-family: "Roboto", Helvetica, Arial, sans-serif;
        }

        .phone-container {
            position: relative;
            height: 100%;
            width: auto;
            /* Giữ tỉ lệ khung hình điện thoại để ảnh không bị bẹt */
            aspect-ratio: 9/19.5; 
        }

        .bg-image {
            width: 100%;
            height: 100%;
            /* 'cover': Lấp đầy màn hình (có thể bị cắt nhẹ rìa để đẹp nhất) */
            /* Nếu muốn thấy toàn bộ ảnh kể cả viền đen thì đổi thành 'contain' */
            object-fit: cover; 
            display: block;
        }

        /* --- 1. CHỈNH ĐỒNG HỒ --- */
        .clock-overlay {
            position: absolute;
            
            /* Chỉnh lên xuống */
            top: 11.5%; 
            
            /* YÊU CẦU 3: DỊCH QUA PHẢI */
            /* Tăng số % lên để dịch sang phải, giảm đi để về trái */
            left: 54%; 
            transform: translateX(-50%);
            
            /* Cỡ chữ */
            font-size: 25px; 
            font-weight: 700;
            
            /* Màu chữ */
            color: #2b2b2b;   
            background-color: transparent;
            
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            z-index: 20;
            white-space: nowrap; /* Ngăn xuống dòng */
        }

        /* --- 2. CHỈNH HÀNG CHẤM --- */
        .dots-wrapper {
            position: absolute;
            
            /* Chỉnh lên xuống */
            top: 36%; 
            
            left: 50%;
            transform: translateX(-50%);
            
            /* Chỉnh độ rộng của cả hàng chấm */
            width: 70%; 
            
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }

        .gray-dot {
            width: 4px;
            height: 4px;
            background-color: #b0b0b0; /* Màu xám của chấm tĩnh */
            border-radius: 50%;
        }

        /* Chấm cam chạy */
        .orange-dot-mover {
            position: absolute;
            top: 50%;
            left: 0;
            width: 10px;
            height: 10px;
            background-color: #e65100;
            border-radius: 50%;
            transform: translateY(-50%);
            animation: slide-right 1.5s linear infinite; 
        }

        @keyframes slide-right {
            0% { left: 5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 95%; opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="phone-container">
        <img src="/img/posts/other/ok/ok.jpg" class="bg-image" alt="App Screen">

        <div class="clock-overlay" id="clock">--:--:--</div>

        <div class="dots-wrapper">
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>

            <div class="orange-dot-mover"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();

            h = h < 10 ? "0" + h : h;
            m = m < 10 ? "0" + m : m;
            s = s < 10 ? "0" + s : s;

            document.getElementById('clock').innerText = h + ":" + m + ":" + s;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
