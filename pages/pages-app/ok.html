<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OK Card App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222; /* Màu nền ngoài rìa */
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: "Roboto", Helvetica, Arial, sans-serif; /* Font chuẩn Android/iOS */
        }

        .phone-container {
            position: relative;
            height: 100%;
            width: 100%;
            max-width: 500px; /* Giới hạn chiều rộng để không bị vỡ trên PC */
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* --- 1. CHỈNH ĐỒNG HỒ TẠI ĐÂY --- */
        .clock-overlay {
            position: absolute;
            
            /* A. CHỈNH VỊ TRÍ LÊN / XUỐNG */
            top: 15.5%;  /* <-- Tăng số này thì tụt xuống, giảm thì bay lên */
            
            /* B. CĂN GIỮA (Không cần sửa) */
            left: 50%;
            transform: translateX(-50%);
            
            /* C. CHỈNH CỠ CHỮ */
            font-size: 27px; /* <-- Tăng giảm số này để chữ to/nhỏ */
            font-weight: 700; /* Độ đậm của chữ */
            
            /* D. MÀU SẮC & KHÔNG NỀN */
            color: #2b2b2b;   /* Màu đen xám (giống màu mực in hơn màu đen tuyền #000) */
            background-color: transparent; /* Trong suốt, không có nền */
            
            letter-spacing: 1px; /* Khoảng cách giữa các số */
            font-variant-numeric: tabular-nums; /* Giúp số đứng yên không bị giật khi giây nhảy */
            z-index: 20;
        }

        /* --- 2. CHỈNH HÀNG CHẤM TẠI ĐÂY --- */
        .dots-wrapper {
            position: absolute;
            
            /* A. CHỈNH VỊ TRÍ LÊN / XUỐNG */
            top: 36%;    /* <-- Tăng số này thì tụt xuống, giảm thì bay lên */
            
            left: 50%;
            transform: translateX(-50%);
            
            /* B. CHỈNH ĐỘ RỘNG HÀNG CHẤM */
            width: 65%; /* <-- Tăng số này thì các chấm xa nhau ra */
            
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            padding: 0 10px;
        }

        .gray-dot {
            width: 4px;      /* Kích thước chấm nhỏ */
            height: 4px;
            background-color: #b0b0b0; /* Màu xám nhạt */
            border-radius: 50%;
        }

        /* Chấm cam chạy (Animation) */
        .orange-dot-mover {
            position: absolute;
            top: 50%;
            left: 0;
            
            width: 10px;    /* Kích thước chấm cam */
            height: 10px;
            
            background-color: #e65100; /* Màu cam chuẩn */
            border-radius: 50%;
            transform: translateY(-50%);
            
            /* Tốc độ chạy: 2s (càng nhỏ chạy càng nhanh) */
            animation: slide-right 2s linear infinite; 
        }

        @keyframes slide-right {
            0% { left: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 90%; opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="phone-container">
        <img src="ok.jpg" class="bg-image" alt="App Screen">

        <div class="clock-overlay" id="clock">--:--:--</div>

        <div class="dots-wrapper">
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>

            <div class="orange-dot-mover"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();

            h = h < 10 ? "0" + h : h;
            m = m < 10 ? "0" + m : m;
            s = s < 10 ? "0" + s : s;

            document.getElementById('clock').innerText = h + ":" + m + ":" + s;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
