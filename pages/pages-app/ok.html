<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OK Card App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Màu mặc định (khi mở bảng) */
            background-color: #757575; 
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: "Roboto", Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        .phone-container {
            position: relative;
            height: 100%;
            width: auto;
            aspect-ratio: 9/19.5;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* --- 1. CHỈNH ĐỒNG HỒ (CỐ ĐỊNH) --- */
        .clock-overlay {
            position: absolute;
            
            /* VỊ TRÍ CỐ ĐỊNH CHO CẢ CODE 1 VÀ CODE 2 */
            top: 12%;       
            left: 54%;      
            transform: translateX(-50%);
            
            font-size: 25px; 
            font-weight: 900;
            color: #2b2b2b;   
            background-color: transparent;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            z-index: 20;
            white-space: nowrap;
            /* Không cần transition top nữa vì nó đứng yên */
        }

        /* --- 2. CHỈNH HÀNG CHẤM (SẼ DI CHUYỂN) --- */
        .dots-wrapper {
            position: absolute;
            
            /* Vị trí mặc định (Code 1) */
            top: 33%;       
            
            left: 50%;
            transform: translateX(-50%);
            width: 70%; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            
            /* Hiệu ứng trượt khi nhảy xuống */
            transition: top 0.3s ease;
        }

        .gray-dot { width: 4px; height: 4px; background-color: #b0b0b0; border-radius: 50%; }
        
        .orange-dot-mover {
            position: absolute; top: 50%; left: 0;
            width: 10px; height: 10px;
            background-color: #e65100;
            border-radius: 50%;
            transform: translateY(-50%);
            animation: slide-right 1.5s linear infinite; 
        }

        @keyframes slide-right {
            0% { left: 5%; opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; } 100% { left: 95%; opacity: 0; }
        }

        /* --- 3. CẤU HÌNH VỊ TRÍ KHI QUA CODE 2 --- */
        /* Lưu ý: Chỉ có dots-wrapper là thay đổi vị trí */
        
        .moved-down .dots-wrapper {
            /* Vị trí chấm khi ở Code 2 (Nhảy xuống dưới) */
            top: 72%; 
        }
        
        /* (Đồng hồ không có trong mục này nên nó sẽ đứng yên) */


        /* --- 4. NÚT BẤM (HOTSPOTS) --- */
        .hotspot {
            position: absolute;
            z-index: 100;
            cursor: pointer;
            /* Bỏ comment dòng dưới nếu muốn thấy nút để chỉnh */
            /* background-color: rgba(255, 0, 0, 0.3); */ 
        }

        /* Nút Góc Phải */
        #btn-corner { top: 0; right: 0; width: 25%; height: 10%; }

        /* Nút Dưới Cùng (X / Mở lại) */
        #btn-bottom { bottom: 5%; left: 50%; transform: translateX(-50%); width: 80%; height: 12%; }

    </style>
</head>
<body>

    <div class="phone-container" id="main-container">
        <img src="/img/posts/other/ok/code1.jpg" class="bg-image" id="app-bg" alt="App Screen">

        <div class="clock-overlay" id="clock">--:--:--</div>

        <div class="dots-wrapper" id="dots">
            <div class="gray-dot"></div><div class="gray-dot"></div><div class="gray-dot"></div>
            <div class="gray-dot"></div><div class="gray-dot"></div><div class="gray-dot"></div>
            <div class="gray-dot"></div><div class="gray-dot"></div><div class="gray-dot"></div>
            <div class="gray-dot"></div><div class="gray-dot"></div><div class="gray-dot"></div>
            <div class="orange-dot-mover"></div>
        </div>

        <div class="hotspot" id="btn-corner" onclick="handleCornerClick()"></div>
        <div class="hotspot" id="btn-bottom" onclick="handleBottomClick()"></div>
    </div>

    <script>
        // --- 1. CẤU HÌNH ẢNH MỚI ---
        const imgPopup1 = "/img/posts/other/ok/code1.jpg"; 
        const imgPopup2 = "/img/posts/other/ok/code2.jpg"; 
        const imgHome   = "/img/posts/other/ok/home.jpg"; 

        // --- 2. CẤU HÌNH MÀU NỀN ---
        const colorPopup = "#757575"; // Màu nền xám Code1/Code2
        const colorHome  = "#ffffff"; // Màu nền trang Home (bạn tự chỉnh cho khớp ảnh home)

        const bgElement = document.getElementById('app-bg');
        const container = document.getElementById('main-container');
        const clock = document.getElementById('clock');
        const dots = document.getElementById('dots');
        let currentState = 'popup1'; 

        function setBackgroundColor(color) {
            document.body.style.backgroundColor = color;
        }

        // Xử lý nút góc phải (Chỉ đổi ảnh và dời chấm)
        function handleCornerClick() {
            if (currentState === 'home') return; 

            if (currentState === 'popup1') {
                bgElement.src = imgPopup2;
                container.classList.add('moved-down'); // Chỉ chấm nhảy xuống
                setBackgroundColor(colorPopup); 
                currentState = 'popup2';
            } else if (currentState === 'popup2') {
                bgElement.src = imgPopup1;
                container.classList.remove('moved-down'); // Chấm về chỗ cũ
                setBackgroundColor(colorPopup); 
                currentState = 'popup1';
            }
        }

        // Xử lý nút dưới cùng (Đóng/Mở)
        function handleBottomClick() {
            if (currentState === 'popup1' || currentState === 'popup2') {
                // Về Home
                bgElement.src = imgHome;
                clock.style.display = 'none';
                dots.style.display = 'none';
                container.classList.remove('moved-down');
                setBackgroundColor(colorHome);
                currentState = 'home';
            } else {
                // Mở lại Code 1
                bgElement.src = imgPopup1;
                clock.style.display = 'block';
                dots.style.display = 'flex';
                setBackgroundColor(colorPopup);
                currentState = 'popup1';
            }
        }

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();
            h = h < 10 ? "0" + h : h;
            m = m < 10 ? "0" + m : m;
            s = s < 10 ? "0" + s : s;
            document.getElementById('clock').innerText = h + ":" + m + ":" + s;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
