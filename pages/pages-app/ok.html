<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OK Card App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Khung chứa giả lập điện thoại */
        .phone-container {
            position: relative;
            height: 100%;
            max-width: 100%;
            aspect-ratio: 9/19.5; /* Tỉ lệ màn hình điện thoại thông thường */
        }

        /* Ảnh nền (Ảnh chụp màn hình của bạn) */
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Đảm bảo ảnh không bị méo */
            display: block;
        }

        /* --- 1. PHẦN ĐỒNG HỒ --- */
        .clock-overlay {
            position: absolute;
            /* CĂN CHỈNH VỊ TRÍ ĐỒNG HỒ Ở ĐÂY */
            top: 15.5%;  /* Thay đổi số này để dịch lên/xuống */
            left: 50%;
            transform: translateX(-50%);
            
            /* Style cho chữ */
            font-size: 26px; /* Cỡ chữ */
            font-weight: 800; /* Độ đậm */
            color: #1a1a1a;   /* Màu chữ đen đậm */
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums; /* Giúp số không bị nhảy khi thay đổi */
            
            /* Nền che đi giờ cũ trong ảnh (nếu cần) */
            background-color: #f6aa48; /* Màu cam nền trùng màu app */
            padding: 2px 10px;
            border-radius: 4px;
            z-index: 10;
        }

        /* --- 2. PHẦN CHẤM CHUYỂN ĐỘNG --- */
        .dots-wrapper {
            position: absolute;
            /* CĂN CHỈNH VỊ TRÍ HÀNG CHẤM Ở ĐÂY */
            top: 35%;    /* Thay đổi số này để dịch lên/xuống */
            left: 50%;
            transform: translateX(-50%);
            
            width: 200px; /* Độ rộng vùng chấm chạy */
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        /* Các chấm xám tĩnh nằm dưới */
        .gray-dot {
            width: 4px;
            height: 4px;
            background-color: #aaa;
            border-radius: 50%;
        }

        /* Chấm cam chạy đè lên trên */
        .orange-dot-mover {
            position: absolute;
            top: 50%;
            left: 0;
            width: 10px;
            height: 10px;
            background-color: #e65100; /* Màu cam đậm của app */
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
            
            /* Hiệu ứng chạy qua lại */
            animation: slide-right 2s linear infinite;
        }

        @keyframes slide-right {
            0% { left: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 90%; opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="phone-container">
        <img src="/img/posts/other/ok/ok.jpg" class="bg-image" alt="App Screen">

        <div class="clock-overlay" id="clock">13:10:40</div>

        <div class="dots-wrapper">
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>
            <div class="gray-dot"></div>

            <div class="orange-dot-mover"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();

            // Thêm số 0 nếu nhỏ hơn 10
            h = h < 10 ? "0" + h : h;
            m = m < 10 ? "0" + m : m;
            s = s < 10 ? "0" + s : s;

            // Cập nhật giờ
            document.getElementById('clock').innerText = h + ":" + m + ":" + s;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
