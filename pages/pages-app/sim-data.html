<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="/js/site-version.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Xem các gói SIM data tháng, SIM data năm, eSIM và SIM vật lý dành cho người Việt tại Nhật Bản.">
  <meta name="theme-color" content="#fff8ef">
  <title>SIM Data Nhật Bản | Vinh ở Nhật</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/logoQV.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/shell-r8.css">
  <link rel="stylesheet" href="/css/sim-shop.css">
</head>
<body class="site-body sim-shop-page">
  <div id="header-placeholder" class="site-header-placeholder"></div>

  <main class="sim-shop-main">
    <section class="sim-shop-hero">
      <div class="sim-shop-hero-copy">
        <span id="simEyebrow">SIM NHẬT BẢN</span>
        <h1 id="simTitle">Chọn SIM data phù hợp</h1>
        <p id="simDescription">Đang tải thông tin…</p>
        <a class="sim-hero-button" href="#simPlans">Xem sản phẩm</a>
      </div>
      <div class="sim-shop-visual" aria-hidden="true">
        <img src="/img/sim/softbank-demo.png" alt="" width="520" height="520" decoding="async">
      </div>
    </section>

    <section id="simPlans" class="sim-plans-section" aria-labelledby="simPlansTitle">
      <div class="sim-section-heading">
        <span>CHỌN THEO NHU CẦU</span>
        <h2 id="simPlansTitle">Các gói SIM đang giới thiệu</h2>
        <p>Chọn SIM tháng hoặc SIM năm. Nhấn vào sản phẩm để xem chi tiết và mua SIM.</p>
      </div>

      <div class="sim-period-tabs" role="tablist" aria-label="Chọn chu kỳ SIM">
        <button type="button" class="active" data-sim-period="monthly" role="tab" aria-selected="true">SIM tháng</button>
        <button type="button" data-sim-period="yearly" role="tab" aria-selected="false">SIM năm</button>
      </div>

      <div id="simPlanGrid" class="sim-catalog" aria-live="polite"></div>
    </section>

    <section class="sim-faq-section">
      <div class="sim-section-heading"><span>GIẢI ĐÁP</span><h2>Câu hỏi thường gặp</h2></div>
      <div id="simFaqList" class="sim-faq-list"></div>
    </section>

    <p id="simNotice" class="sim-shop-notice"></p>
  </main>

  <div id="simDetailModal" class="sim-detail-modal" hidden>
    <button class="sim-detail-backdrop" type="button" data-sim-close aria-label="Đóng"></button>
    <section class="sim-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="simDetailTitle">
      <button class="sim-detail-close" type="button" data-sim-close aria-label="Đóng">×</button>
      <div id="simDetailContent"></div>
    </section>
  </div>

  <div id="simOrderToast" class="sim-order-toast" hidden></div>
  <div id="footer-placeholder"></div>
  <button id="scrollToTopBtn" class="scroll-top" type="button" aria-label="Lên đầu trang"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
  <script src="/js/script.js" defer></script>
  <script src="/js/sim-shop.js" defer></script>
</body>
</html>
