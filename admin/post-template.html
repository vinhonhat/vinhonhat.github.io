<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PHIÊN BẢN V26.1.18 -->
    <title>{{POST_TITLE}} | Vinh ở Nhật</title> 
    <meta name="description" content="{{META_DESCRIPTION}}">
    <meta property="og:title" content="{{POST_TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:image" content="{{META_IMAGE_URL}}">
    <meta property="og:url" content="{{POST_LINK}}">
    <meta property="og:type" content="article">
    
    <link rel="manifest" href="/manifest.json"> 
    <meta name="theme-color" content="#F6AD55"> 
    <link rel="apple-touch-icon" href="/img/logo1.png"> 
    
    <link rel="icon" href="/img/logoQV.png" type="image/x-icon"> 

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/css/style.css">


</head>

<body class="bg-[#FBF7F0] overflow-x-hidden">
    
<!-- ================= HEADER ================= -->
    <div id="header-placeholder" class="sticky top-0 z-50 bg-white shadow-md"></div>

<!-- ================= MAIN ================= -->

<main class="container mx-auto px-4 sm:px-6 lg:px-8 xl:px-24 mt-8">
        
    <!-- =========================================== -->
    <!-- ===== KHỐI TIÊU ĐỀ MỚI ĐƯỢC THÊM VÀO ===== -->
    <!-- =========================================== -->
    <div class="mb-4 lg:w-2/3">
        <!-- Tiêu đề này sẽ lấy từ ô "Tiêu đề" trong admin -->
        <h1 id="page-title" class="text-2xl font-bold text-gray-800 border-l-8 border-yellow-500 pl-4">{{ARTICLE_TITLE}}</h1>
        <!-- Chỉ giữ lại ngày tháng ở đây (thêm class "italic") -->
        <p class="text-gray-500 italic pl-6">Ngày đăng: {{ARTICLE_DATE}}</p>
    </div>
    <!-- =========================================== -->

    <div class="flex flex-col lg:flex-row lg:space-x-8">
        
        <article class="lg:w-2/3 bg-white p-6 md:p-8 rounded-lg shadow-md">
                              
            <!-- Nội dung chính từ admin sẽ được chèn vào đây -->
            <div id="article-content" class="prose max-w-none prose-img:rounded-lg prose-img:w-full prose-img:h-auto prose-img:shadow-md prose-img:mx-auto prose-h2:border-l-4 prose-h2:border-yellow-500 prose-h2:pl-3 prose-a:text-yellow-600 hover:prose-a:underline break-words">
                {{ARTICLE_CONTENT}}
            </div>
        </article>

        <!-- Phần Bài viết gợi ý (Giữ nguyên) -->
        <aside class="lg:w-1/3 mt-10 lg:mt-0">
            <div class="sticky top-24 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-bold text-gray-800 border-l-4 border-yellow-500 pl-3 mb-4">Bài viết gợi ý</h2>
                <div id="suggested-posts-container" class="grid grid-cols-2 gap-4 lg:grid-cols-1">
                    </div>
            </div>
        </aside>
    </div>
</main>

<!-- =========================================== -->
    <!--  MÃ JAVASCRIPT ĐIỀU KHIỂN TAB (MỚI)        -->
    <!-- =========================================== -->
    <script>
        // Mã này sẽ tìm các tab-container và làm cho chúng hoạt động
        document.addEventListener('DOMContentLoaded', function() {
            // Tìm tất cả các container tab trên trang
            const tabContainers = document.querySelectorAll('.tab-container');
            
            tabContainers.forEach(container => {
                const tabButtons = container.querySelectorAll('.tab-btn');
                const tabPanels = container.querySelectorAll('.tab-panel');

                // Kiểm tra xem số lượng nút và panel có khớp không
                if (tabButtons.length === 0 || tabButtons.length !== tabPanels.length) {
                    console.warn('Lỗi cấu trúc Tab: Số lượng nút bấm và nội dung không khớp.');
                    return; // Bỏ qua nếu cấu trúc bị lỗi
                }

                tabButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        // Lấy ID của tab mục tiêu từ nút bấm
                        const targetTabId = button.getAttribute('data-tab-id');

                        // 1. Cập nhật giao diện nút bấm
                        tabButtons.forEach(btn => {
                            const isSelected = (btn === button);
                            btn.classList.toggle('border-yellow-500', isSelected);
                            btn.classList.toggle('text-yellow-600', isSelected);
                            btn.classList.toggle('border-transparent', !isSelected);
                            btn.classList.toggle('text-gray-500', !isSelected);
                            btn.classList.toggle('hover:text-gray-700', !isSelected);
                        });

                        // 2. Ẩn/Hiện nội dung
                        tabPanels.forEach(panel => {
                            const panelId = panel.getAttribute('data-panel-id');
                            panel.classList.toggle('hidden', panelId !== targetTabId);
                        });
                    });
                });
            });
        });
    </script>




    <!-- ================= FOODER ================= -->   
    <div id="footer-placeholder"></div>

    <!-- ================= nút lên đầu trang ================= -->
    <button id="scrollToTopBtn" class="fixed bottom-6 right-6 bg-yellow-600 text-white w-14 h-12 rounded-lg shadow-lg flex flex-col justify-center items-center text-xs transition-opacity duration-300 hover:bg-yellow-700 opacity-0 pointer-events-none z-40">
        <i class="fas fa-arrow-up text-lg mb-1"></i>
        <span class="font-semibold">Lên đầu</span>
    </button>
    
    <script src="/js/script.js"></script>
    <script src="/pages/page-leve3.js"></script>
    <script src="/js/lunar-calendar.js"></script>

    </body>
</html>
