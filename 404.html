<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="/js/site-version.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang chuyển hướng...</title>
  <script>
    (function () {
      var segment = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '').toLowerCase();
      var test = segment.match(/^test(?:holiday|holyday)([a-z0-9_-]+)$/i);
      var fireworks = segment.match(/^test(?:fireworks?|phaohoa)([a-z0-9_-]+)$/i);
      var target = '/';
      if (fireworks) target = '/?testfireworks' + fireworks[1];
      else if (test) target = '/?testholiday' + test[1];
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Đang chuyển về trang chủ…</p>
</body>
</html>
